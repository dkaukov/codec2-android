plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.dkaukov'
version = providers.gradleProperty('VERSION_NAME').get()

android {
    namespace 'io.github.dkaukov.codec2'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // x86 is retained because kv4p-ht currently builds it as well.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                targets 'codec2-android'
            }
        }
        consumerProguardFiles 'consumer-rules.pro'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = 'codec2-android'
            version = project.version

            afterEvaluate {
                from components.release
            }

            pom {
                name = 'codec2-android'
                description = 'A minimal Android JNI wrapper for Codec2 mode 1300.'
                url = 'https://github.com/dkaukov/codec2-android'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'dkaukov'
                        name = 'Dmitry Kaukov'
                        url = 'https://github.com/dkaukov'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/dkaukov/codec2-android.git'
                    developerConnection = 'scm:git:ssh://git@github.com/dkaukov/codec2-android.git'
                    url = 'https://github.com/dkaukov/codec2-android'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'MavenCentral'
            url = uri('https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
            credentials {
                username = providers.gradleProperty('mavenCentralUsername')
                        .orElse(providers.environmentVariable('MAVEN_CENTRAL_USERNAME')).getOrElse('')
                password = providers.gradleProperty('mavenCentralPassword')
                        .orElse(providers.environmentVariable('MAVEN_CENTRAL_PASSWORD')).getOrElse('')
            }
        }
    }
}

signing {
    def key = providers.gradleProperty('signingKey')
            .orElse(providers.environmentVariable('SIGNING_KEY')).getOrNull()
    def password = providers.gradleProperty('signingPassword')
            .orElse(providers.environmentVariable('SIGNING_PASSWORD')).getOrNull()
    if (key != null) {
        useInMemoryPgpKeys(key, password)
        sign publishing.publications.release
    }
}

tasks.register('verifyReleaseAar') {
    dependsOn 'bundleReleaseAar'
    doLast {
        def aar = layout.buildDirectory.file('outputs/aar/codec2-release.aar').get().asFile
        if (!aar.isFile()) {
            throw new GradleException("Release AAR was not produced: ${aar}")
        }
        def entries = zipTree(aar).files.collect { it.path.replace('\\', '/') }
        ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
            ['libcodec2.so', 'libcodec2-android.so'].each { library ->
                if (!entries.any { it.endsWith("/jni/${abi}/${library}") }) {
                    throw new GradleException("Missing jni/${abi}/${library} in ${aar.name}")
                }
            }
        }
        if (!entries.any { it.endsWith('/assets/LICENSES/codec2-android-LGPL-2.1.txt') }
                || !entries.any { it.endsWith('/assets/LICENSES/Codec2-LGPL-2.1.txt') }
                || !entries.any { it.endsWith('/assets/NOTICE') }) {
            throw new GradleException("License files are missing from ${aar.name}")
        }
    }
}

tasks.named('publishReleasePublicationToMavenCentralRepository') {
    doFirst {
        if (!providers.gradleProperty('signingKey')
                .orElse(providers.environmentVariable('SIGNING_KEY')).isPresent()) {
            throw new GradleException('A signingKey or SIGNING_KEY is required for Maven Central')
        }
    }
}
